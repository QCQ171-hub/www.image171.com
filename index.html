<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片颜色转透明工具</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --panel: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 { margin-bottom: 20px; font-size: 1.5rem; }

        .container {
            background: var(--panel);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            max-width: 900px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid #e2e8f0;
        }

        input[type="file"] {
            flex: 1;
        }

        .slider-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 200px;
        }

        input[type="range"] {
            flex: 1;
            cursor: pointer;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }
        button:disabled { background-color: #cbd5e1; cursor: not-allowed; }

        .canvas-wrapper {
            position: relative;
            overflow: auto;
            max-height: 70vh;
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            /* 棋盘格背景，用于显示透明度 */
            background-image: 
                linear-gradient(45deg, #eee 25%, transparent 25%), 
                linear-gradient(-45deg, #eee 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #eee 75%), 
                linear-gradient(-45deg, transparent 75%, #eee 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 300px;
        }

        canvas {
            max-width: 100%;
            cursor: crosshair;
            display: block;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: #64748b;
        }

        .color-preview {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            border: 1px solid #ccc;
            display: inline-block;
            vertical-align: middle;
            margin-left: 5px;
            background-color: transparent;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <h1>🎨 图片颜色转透明工具</h1>

    <div class="container">
        <div class="controls">
            <input type="file" id="fileInput" accept="image/*">
            
            <div class="slider-group">
                <label for="threshold">阈值 (0-255):</label>
                <input type="range" id="threshold" min="0" max="255" value="0">
                <span id="thresholdVal">0</span>
            </div>

            <button id="downloadBtn" disabled>下载透明图</button>
        </div>

        <div class="status-bar">
            <span id="statusText">请上传图片...</span>
            <div id="pickedColorBox" class="hidden">
                选中颜色: <span id="pickedColorHex">#------</span>
                <span id="colorPreview" class="color-preview"></span>
            </div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="canvas"></canvas>
        </div>
    </div>

<script>
    const fileInput = document.getElementById('fileInput');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const thresholdInput = document.getElementById('threshold');
    const thresholdVal = document.getElementById('thresholdVal');
    const downloadBtn = document.getElementById('downloadBtn');
    const statusText = document.getElementById('statusText');
    const pickedColorBox = document.getElementById('pickedColorBox');
    const pickedColorHex = document.getElementById('pickedColorHex');
    const colorPreview = document.getElementById('colorPreview');

    let originalImage = null; // 存储原始 Image 对象
    let targetColor = null;   // 存储选中的 RGB {r, g, b}
    let isProcessing = false;

    // 1. 加载图片
    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                originalImage = img;
                resetCanvas();
                downloadBtn.disabled = false;
                statusText.textContent = "图片已加载。请点击图片选取要消除的颜色。";
                targetColor = null;
                pickedColorBox.classList.add('hidden');
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    // 重置画布并绘制原图
    function resetCanvas() {
        if (!originalImage) return;
        canvas.width = originalImage.width;
        canvas.height = originalImage.height;
        ctx.drawImage(originalImage, 0, 0);
    }

    // 2. 点击取色
    canvas.addEventListener('click', (e) => {
        if (!originalImage) return;

        // 计算点击位置相对于 Canvas 的坐标（考虑 CSS 缩放）
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        
        const x = Math.floor((e.clientX - rect.left) * scaleX);
        const y = Math.floor((e.clientY - rect.top) * scaleY);

        // 获取像素数据
        const pixel = ctx.getImageData(x, y, 1, 1).data;
        targetColor = { r: pixel[0], g: pixel[1], b: pixel[2] };

        // 更新 UI
        const hex = rgbToHex(targetColor.r, targetColor.g, targetColor.b);
        pickedColorHex.textContent = hex;
        colorPreview.style.backgroundColor = hex;
        pickedColorBox.classList.remove('hidden');
        statusText.textContent = "已选取颜色，正在处理...";

        processImage();
    });

    // 3. 阈值改变时重新处理
    thresholdInput.addEventListener('input', (e) => {
        thresholdVal.textContent = e.target.value;
        if (originalImage && targetColor) {
            // 使用防抖避免滑动时过于卡顿
            clearTimeout(window.debounceTimer);
            window.debounceTimer = setTimeout(() => {
                processImage();
            }, 50);
        }
    });

    // 4. 核心处理逻辑
    function processImage() {
        if (!originalImage || !targetColor) return;

        // 先重绘原图
        ctx.drawImage(originalImage, 0, 0);

        const threshold = parseInt(thresholdInput.value);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;

        // 遍历所有像素
        for (let i = 0; i < data.length; i += 4) {
            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];
            // alpha 是 data[i+3]

            // 计算与目标颜色的差值绝对值
            const diffR = Math.abs(r - targetColor.r);
            const diffG = Math.abs(g - targetColor.g);
            const diffB = Math.abs(b - targetColor.b);

            // 只有当 R、G、B 三个通道的差值都小于等于阈值时，才变为透明
            if (diffR <= threshold && diffG <= threshold && diffB <= threshold) {
                data[i + 3] = 0; // Alpha 设为 0 (完全透明)
            }
        }

        ctx.putImageData(imageData, 0, 0);
        statusText.textContent = "处理完成。可继续点击图片选取其他颜色，或下载结果。";
    }

    // 5. 下载图片
    downloadBtn.addEventListener('click', () => {
        if (!originalImage) return;
        const link = document.createElement('a');
        link.download = 'transparent_output.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    });

    // 辅助函数：RGB 转 Hex
    function rgbToHex(r, g, b) {
        return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片透明工具 - 魔棒 & 画笔</title>
    <style>
        :root {
            --primary: #2563eb;
            --danger: #ef4444;
            --success: #22c55e;
            --bg: #f8fafc;
            --panel: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 { margin-bottom: 16px; font-size: 1.5rem; }

        .container {
            background: var(--panel);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            max-width: 960px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* ---- 顶部文件栏 ---- */
        .top-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .top-bar input[type="file"] { flex: 1; min-width: 160px; }

        /* ---- 工具栏 ---- */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        /* 模式切换 */
        .mode-tabs {
            display: flex;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--primary);
        }

        .mode-tabs button {
            border-radius: 0;
            background: #fff;
            color: var(--primary);
            border: none;
            padding: 6px 14px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
            transition: all 0.15s;
        }

        .mode-tabs button.active {
            background: var(--primary);
            color: #fff;
        }

        /* 动作切换 */
        .action-toggle {
            display: flex;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .action-toggle button {
            border-radius: 0;
            background: #fff;
            color: var(--text);
            border: none;
            padding: 6px 14px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
            transition: all 0.15s;
        }

        .action-toggle button.erase-active {
            background: var(--danger);
            color: #fff;
        }

        .action-toggle button.restore-active {
            background: var(--success);
            color: #fff;
        }

        /* 滑块组 */
        .slider-group {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
        }

        .slider-group input[type="range"] {
            width: 100px;
            cursor: pointer;
        }

        .slider-group .val {
            min-width: 28px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        /* 按钮 */
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 7px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.85; }
        .btn:disabled { background-color: #cbd5e1; cursor: not-allowed; }

        .btn-outline {
            background: #fff;
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        .btn-outline:hover { background: #eff6ff; }

        /* ---- 画布 ---- */
        .canvas-wrapper {
            position: relative;
            overflow: auto;
            max-height: 70vh;
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            background-image:
                linear-gradient(45deg, #eee 25%, transparent 25%),
                linear-gradient(-45deg, #eee 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #eee 75%),
                linear-gradient(-45deg, transparent 75%, #eee 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 300px;
        }

        canvas {
            display: block;
            max-width: 100%;
        }

        /* ---- 状态栏 ---- */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #64748b;
            flex-wrap: wrap;
            gap: 8px;
        }

        .right-actions {
            display: flex;
            gap: 8px;
            margin-left: auto;
        }

        .hidden { display: none !important; }

        /* 笔刷预览光标提示 */
        .brush-info {
            font-size: 0.8rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<h1>🎨 图片透明工具 — 魔棒 & 画笔</h1>

<div class="container">

    <!-- 顶部：文件 + 下载 -->
    <div class="top-bar">
        <input type="file" id="fileInput" accept="image/*">
        <button class="btn btn-outline" id="resetBtn" disabled>↩ 重置</button>
        <button class="btn" id="downloadBtn" disabled>⬇ 下载透明图</button>
    </div>

    <!-- 工具栏 -->
    <div class="toolbar">
        <!-- 模式 -->
        <div class="mode-tabs">
            <button id="modeWand" class="active" title="魔棒选取">🪄 魔棒</button>
            <button id="modeBrush" title="画笔擦除/恢复">🖌 画笔</button>
        </div>

        <!-- 动作 -->
        <div class="action-toggle">
            <button id="actionErase" class="erase-active">✕ 擦除</button>
            <button id="actionRestore">✓ 恢复</button>
        </div>

        <!-- 魔棒阈值 -->
        <div class="slider-group" id="wandGroup">
            <label>魔棒阈值:</label>
            <input type="range" id="wandThreshold" min="0" max="255" value="32">
            <span class="val" id="wandThresholdVal">32</span>
        </div>

        <!-- 画笔大小 -->
        <div class="slider-group hidden" id="brushGroup">
            <label>笔刷大小:</label>
            <input type="range" id="brushSize" min="1" max="150" value="20">
            <span class="val" id="brushSizeVal">20</span>
            <span class="brush-info">px</span>
        </div>
    </div>

    <!-- 状态栏 -->
    <div class="status-bar">
        <span id="statusText">请上传图片…</span>
    </div>

    <!-- 画布 -->
    <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="canvas"></canvas>
    </div>
</div>

<script>
// ============ DOM ============
const fileInput      = document.getElementById('fileInput');
const canvas         = document.getElementById('canvas');
const ctx            = canvas.getContext('2d', { willReadFrequently: true });
const canvasWrapper  = document.getElementById('canvasWrapper');
const resetBtn       = document.getElementById('resetBtn');
const downloadBtn    = document.getElementById('downloadBtn');
const statusText     = document.getElementById('statusText');

const modeWandBtn    = document.getElementById('modeWand');
const modeBrushBtn   = document.getElementById('modeBrush');
const actionEraseBtn = document.getElementById('actionErase');
const actionRestoreBtn = document.getElementById('actionRestore');

const wandGroup        = document.getElementById('wandGroup');
const wandThreshold    = document.getElementById('wandThreshold');
const wandThresholdVal = document.getElementById('wandThresholdVal');

const brushGroup     = document.getElementById('brushGroup');
const brushSize      = document.getElementById('brushSize');
const brushSizeVal   = document.getElementById('brushSizeVal');

// ============ 状态 ============
let originalImageData = null; // ImageData 原始快照
let currentMode  = 'wand';   // 'wand' | 'brush'
let currentAction = 'erase'; // 'erase' | 'restore'
let isPainting   = false;
let lastBrushPos = null;

// ============ 1. 加载图片 ============
fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
            canvas.width  = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);
            // 保存原始像素快照
            originalImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            resetBtn.disabled   = false;
            downloadBtn.disabled = false;
            setStatus('图片已加载。选择模式后在画布上操作。');
        };
        img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
});

// ============ 2. 模式切换 ============
modeWandBtn.addEventListener('click', () => {
    currentMode = 'wand';
    modeWandBtn.classList.add('active');
    modeBrushBtn.classList.remove('active');
    wandGroup.classList.remove('hidden');
    brushGroup.classList.add('hidden');
    canvas.style.cursor = 'crosshair';
    setStatus('魔棒模式：点击图片上的区域进行选取。');
});

modeBrushBtn.addEventListener('click', () => {
    currentMode = 'brush';
    modeBrushBtn.classList.add('active');
    modeWandBtn.classList.remove('active');
    brushGroup.classList.remove('hidden');
    wandGroup.classList.add('hidden');
    canvas.style.cursor = 'none'; // 自定义光标
    setStatus('画笔模式：按住鼠标涂抹。');
});

// ============ 3. 动作切换 ============
actionEraseBtn.addEventListener('click', () => {
    currentAction = 'erase';
    actionEraseBtn.classList.add('erase-active');
    actionRestoreBtn.classList.remove('restore-active');
    setStatus(`当前动作：擦除（变透明）`);
});

actionRestoreBtn.addEventListener('click', () => {
    currentAction = 'restore';
    actionRestoreBtn.classList.add('restore-active');
    actionEraseBtn.classList.remove('erase-active');
    setStatus(`当前动作：恢复（还原像素）`);
});

// ============ 4. 滑块 ============
wandThreshold.addEventListener('input', (e) => {
    wandThresholdVal.textContent = e.target.value;
});

brushSize.addEventListener('input', (e) => {
    brushSizeVal.textContent = e.target.value;
});

// ============ 5. 画布坐标转换 ============
function canvasCoords(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width  / rect.width;
    const scaleY = canvas.height / rect.height;
    return {
        x: Math.floor((e.clientX - rect.left) * scaleX),
        y: Math.floor((e.clientY - rect.top)  * scaleY)
    };
}

// ============ 6. 魔棒（区域生长 Flood Fill）============
canvas.addEventListener('click', (e) => {
    if (!originalImageData) return;
    if (currentMode !== 'wand') return;

    const { x, y } = canvasCoords(e);
    const w = canvas.width, h = canvas.height;
    if (x < 0 || y < 0 || x >= w || y >= h) return;

    const threshold = parseInt(wandThreshold.value);
    const imageData = ctx.getImageData(0, 0, w, h);
    const data = imageData.data;
    const origData = originalImageData.data;

    const visited = new Uint8Array(w * h); // 0 = 未访问
    const queue = [x, y]; // 扁平队列 [x0,y0,x1,y1,...]
    visited[y * w + x] = 1;

    const erase = currentAction === 'erase';

    // BFS 区域生长：比较相邻像素间颜色距离
    while (queue.length > 0) {
        const cy = queue.pop();
        const cx = queue.pop();
        const ci = (cy * w + cx) * 4;

        // 对当前像素执行动作
        if (erase) {
            data[ci + 3] = 0;
        } else {
            // 恢复：从原始数据恢复 RGBA
            data[ci]     = origData[ci];
            data[ci + 1] = origData[ci + 1];
            data[ci + 2] = origData[ci + 2];
            data[ci + 3] = origData[ci + 3];
        }

        // 当前像素颜色（用原始数据做比较，避免已修改像素干扰）
        const cr = origData[ci];
        const cg = origData[ci + 1];
        const cb = origData[ci + 2];

        // 4-邻域
        const neighbors = [
            [cx - 1, cy], [cx + 1, cy],
            [cx, cy - 1], [cx, cy + 1]
        ];

        for (const [nx, ny] of neighbors) {
            if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
            const ni = ny * w + nx;
            if (visited[ni]) continue;

            const pi = ni * 4;
            const nr = origData[pi];
            const ng = origData[pi + 1];
            const nb = origData[pi + 2];

            // 颜色距离（欧几里得）
            const dist = Math.sqrt(
                (cr - nr) ** 2 +
                (cg - ng) ** 2 +
                (cb - nb) ** 2
            );

            if (dist <= threshold) {
                visited[ni] = 1;
                queue.push(nx, ny);
            }
        }
    }

    ctx.putImageData(imageData, 0, 0);
    setStatus(`魔棒${erase ? '擦除' : '恢复'}完成（阈值 ${threshold}）。`);
});

// ============ 7. 画笔（mousedown / mousemove / mouseup）============
canvas.addEventListener('mousedown', (e) => {
    if (!originalImageData || currentMode !== 'brush') return;
    isPainting = true;
    lastBrushPos = canvasCoords(e);
    paintStroke(lastBrushPos, lastBrushPos);
});

canvas.addEventListener('mousemove', (e) => {
    if (!originalImageData || currentMode !== 'brush') return;

    // 自定义光标跟随
    drawBrushCursor(e);

    if (!isPainting) return;
    const pos = canvasCoords(e);
    paintStroke(lastBrushPos, pos);
    lastBrushPos = pos;
});

canvas.addEventListener('mouseup',   () => { isPainting = false; lastBrushPos = null; });
canvas.addEventListener('mouseleave', () => { isPainting = false; lastBrushPos = null; hideBrushCursor(); });

// ---- 画笔绘制 ----
function paintStroke(from, to) {
    const w = canvas.width, h = canvas.height;
    const radius = parseInt(brushSize.value) / 2;
    const erase  = currentAction === 'erase';
    const imageData = ctx.getImageData(0, 0, w, h);
    const data     = imageData.data;
    const origData = originalImageData.data;

    // 沿 from→to 插值，保证连续涂抹无断点
    const dx = to.x - from.x;
    const dy = to.y - from.y;
    const steps = Math.max(Math.abs(dx), Math.abs(dy), 1);

    for (let s = 0; s <= steps; s++) {
        const t  = steps === 0 ? 0 : s / steps;
        const cx = Math.round(from.x + dx * t);
        const cy = Math.round(from.y + dy * t);

        // 在 (cx,cy) 画一个圆形区域
        const x0 = Math.max(0, Math.floor(cx - radius));
        const x1 = Math.min(w - 1, Math.ceil(cx + radius));
        const y0 = Math.max(0, Math.floor(cy - radius));
        const y1 = Math.min(h - 1, Math.ceil(cy + radius));
        const r2 = radius * radius;

        for (let py = y0; py <= y1; py++) {
            for (let px = x0; px <= x1; px++) {
                const distSq = (px - cx) ** 2 + (py - cy) ** 2;
                if (distSq > r2) continue;
                const i = (py * w + px) * 4;
                if (erase) {
                    data[i + 3] = 0;
                } else {
                    data[i]     = origData[i];
                    data[i + 1] = origData[i + 1];
                    data[i + 2] = origData[i + 2];
                    data[i + 3] = origData[i + 3];
                }
            }
        }
    }

    ctx.putImageData(imageData, 0, 0);
}

// ---- 自定义画笔光标（覆盖层 Canvas）----
let cursorCanvas = null;
function ensureCursorCanvas() {
    if (!cursorCanvas) {
        cursorCanvas = document.createElement('canvas');
        cursorCanvas.style.cssText = 'position:absolute;pointer-events:none;z-index:10;';
        canvasWrapper.style.position = 'relative';
        canvasWrapper.appendChild(cursorCanvas);
    }
}

function drawBrushCursor(e) {
    ensureCursorCanvas();
    const rect = canvas.getBoundingClientRect();
    const size = parseInt(brushSize.value);
    const displayScale = rect.width / canvas.width;
    const displaySize = Math.max(size * displayScale, 4);

    cursorCanvas.width  = displaySize + 4;
    cursorCanvas.height = displaySize + 4;
    cursorCanvas.style.width  = cursorCanvas.width + 'px';
    cursorCanvas.style.height = cursorCanvas.height + 'px';
    cursorCanvas.style.left   = (e.clientX - rect.left + canvasWrapper.scrollLeft - cursorCanvas.width / 2) + 'px';
    cursorCanvas.style.top    = (e.clientY - rect.top  + canvasWrapper.scrollTop  - cursorCanvas.height / 2) + 'px';

    const cctx = cursorCanvas.getContext('2d');
    cctx.clearRect(0, 0, cursorCanvas.width, cursorCanvas.height);
    cctx.strokeStyle = currentAction === 'erase' ? '#ef4444' : '#22c55e';
    cctx.lineWidth = 1.5;
    cctx.beginPath();
    cctx.arc(cursorCanvas.width / 2, cursorCanvas.height / 2, displaySize / 2, 0, Math.PI * 2);
    cctx.stroke();
}

function hideBrushCursor() {
    if (cursorCanvas) {
        const cctx = cursorCanvas.getContext('2d');
        cctx.clearRect(0, 0, cursorCanvas.width, cursorCanvas.height);
    }
}

// ============ 8. 重置 ============
resetBtn.addEventListener('click', () => {
    if (!originalImageData) return;
    ctx.putImageData(originalImageData, 0, 0);
    setStatus('已重置为原始图片。');
});

// ============ 9. 下载 ============
downloadBtn.addEventListener('click', () => {
    if (!originalImageData) return;
    const link = document.createElement('a');
    link.download = 'transparent_output.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
});

// ============ 工具 ============
function setStatus(msg) {
    statusText.textContent = msg;
}

// 初始化光标
canvas.style.cursor = 'crosshair';
</script>

</body>
</html>
